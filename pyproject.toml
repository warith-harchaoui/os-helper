[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "os-helper"
version = "2.3.1"
description = "Cross-platform Python utility functions for file handling, system operations, string manipulation, folder management, hashing, configuration loading, and timing/profiling primitives — exposed as library, argparse CLI and click CLI."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"},
]
keywords = ["utilities", "filesystem", "config", "hashing", "timing", "profiling", "cross-platform"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "requests>=2.32.3,<3",
    "python-dotenv>=1.0.1,<2",
    "pyyaml>=6.0.2,<7",
    "validators>=0.34.0,<1",
    "tqdm>=4.66,<5",
    # Cross-platform RAM + physical-core-count reporting (hardware_utils.py).
    "psutil>=5.9,<8",
]

[project.optional-dependencies]
# CLI-only-with-click extra. argparse variant needs no runtime dep and
# is always available.
cli = ["click>=8.1,<9"]
# GUI extra — the optional "Tree Radar" treemap dashboard (os_helper.gui).
# Deliberately kept OUT of the core dependencies: `import os_helper as osh`
# must stay FastAPI-free so the 9 suite repos that depend on os-helper never
# pay for a web stack they don't use. Install only when you want the GUI:
#   pip install "os-helper[gui]"
# `httpx` is FastAPI's TestClient transport, needed by the GUI route test.
gui = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
]
# HTTP API extra (os_helper.api) — the safe, side-effect-free subset of the
# library over FastAPI: hardware info, hashing, ASCII, size/time formatting,
# URL check, config loading. Deliberately kept OUT of core deps, same reason
# as `gui`: `import os_helper` must stay FastAPI-free for every downstream repo.
api = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
]
# MCP extra (os_helper.mcp) — exposes the SAME FastAPI app from `[api]` as MCP
# tools via fastapi-mcp; needs the api extra's runtime deps too.
mcp = [
    "os-helper[api]",
    "fastapi-mcp>=0.3,<1",
    # Cap the MCP SDK below 2.0: fastapi-mcp 0.4.0 declares only `mcp>=1.12`
    # (no upper bound), but mcp 2.0.0 changed the low-level `Server.__init__`
    # signature and breaks fastapi-mcp at import. Pin to the 1.x line until
    # fastapi-mcp ships a 2.x-compatible release (same issue hit md2star).
    "mcp>=1.12,<2",
]
# `dev` keeps the bar low for CI — pytest + click (so the click CLI
# import always resolves in tests) + the api/gui/mcp stacks (so those
# surfaces are actually exercised on every push, not silently skipped).
# No AI inference here, so no DeepEval / Giskard.
dev = [
    "pytest>=8",
    "click>=8.1,<9",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "httpx>=0.27,<1",
    "fastapi-mcp>=0.3,<1",
    "mcp>=1.12,<2",
]

[project.scripts]
# argparse-based CLI — no runtime dep beyond stdlib + core package.
os-helper = "os_helper.cli_argparse:main"
# click-based twin — install with [cli] extra.
os-helper-click = "os_helper.cli_click:main"
# Optional GUI launcher — starts the local Tree Radar server (needs [gui]).
os-helper-gui = "os_helper.gui:_cli_main"
# Optional HTTP API server (needs [api]).
os-helper-api = "os_helper.api:main"
# Optional HTTP API + MCP server (needs [mcp]).
os-helper-mcp = "os_helper.mcp:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/os-helper"
Issues = "https://github.com/warith-harchaoui/os-helper/issues"

[tool.setuptools.packages.find]
include = ["os_helper*"]
exclude = ["tests*", "assets*"]

[tool.setuptools.package-data]
# PEP 561 marker: ship this package's inline type hints to consumers, so
# downstream repos running `mypy --strict` (e.g. best-engine-ai-helper) see
# real return types from `import os_helper` instead of implicit `Any`.
"os_helper" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["assets", "tests"]

[tool.ruff.lint]
# Conservative starter set: pyflakes (F), pycodestyle errors (E), warnings (W),
# isort (I), bugbear (B), comprehensions (C4), pyupgrade (UP), simplify (SIM).
# Easy to tighten later; this is the baseline.
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM"]
ignore = [
    "E501",  # line-too-long — handled by formatter / context-dependent
    "B008",  # function call in argument default — too noisy for our style
    "SIM108",  # ternary preferred over if/else — sometimes hurts readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False in pytest is fine
