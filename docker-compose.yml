# os-helper — Compose entry point for the container image next to this file.
#
# Unlike the rest of the suite this service has no port: os-helper ships no
# command line and no server in its core install. The FastAPI and MCP doors
# live in the [api] / [mcp] extras and are not in the image, which is
# deliberate — os-helper is the suite's foundation (logging, paths, hashing,
# config) and its image is kept slim on purpose.
#
# So this file standardises the *one-shot* shape rather than a long-running
# one: the working directory is mounted at /data once, here, instead of being
# retyped on every `docker run -v`.
#
#   docker compose run --rm os-helper python -c \
#     'import os_helper as osh; print(osh.hashfile("/data/pyproject.toml"))'
#
# `docker compose up` prints the installed version and exits 0. That is the
# image's own default command, and the honest behaviour for a library.

services:
  os-helper:
    build: .
    image: os-helper:local
    # The host directory you ran Compose from, readable and writable at /data.
    volumes:
      - ./:/data
    working_dir: /data
    environment:
      PYTHONUNBUFFERED: "1"
    # No `restart:` — a one-shot command that exits 0 must not be revived.
