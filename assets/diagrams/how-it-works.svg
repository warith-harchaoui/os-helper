<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1218 432" width="1218" height="432" role="img" aria-labelledby="osh-title osh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="osh-title">How os-helper works: the same call, whatever machine it lands on</title>
  <desc id="osh-desc">A left-to-right plate. In: a path, a configuration file or the machine itself. The work, in three numbered stages: it detects the operating system and inspects the hardware; it carries out file and folder operations with hashing, temporary directories and safe input/output; and it provides the logging, configuration loading and timing every other member of the suite calls. Out: code that runs unchanged on macOS, Linux and Windows. Underneath, the core object reached through the four surfaces every member exposes: a Python API, a click CLI, a FastAPI server with its MCP tools mounted on the same app, and an agent skill. The caption records that this is the only member the others all depend on.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="172" height="78" rx="10"/>
  <text class="n-title" x="114" y="120" text-anchor="middle">a path, a config</text>
  <text class="n-sub" x="114" y="139" text-anchor="middle">or the machine itself</text>
  <path class="flow" d="M206 126 H222" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="226" y="54" width="748" height="144" rx="12"/>
  <text class="panel-label" x="246" y="76">WHAT IT DOES</text>
  <rect class="stage" x="246" y="94" width="205" height="78" rx="10"/>
  <text class="n-title" x="349" y="127" text-anchor="middle">detect the machine</text>
  <text class="n-sub" x="349" y="146" text-anchor="middle">OS, hardware, capabilities</text>
  <text class="step" x="257" y="110">1</text>
  <path class="flow" d="M455 133 H471" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="477" y="94" width="219" height="78" rx="10"/>
  <text class="n-title" x="587" y="127" text-anchor="middle">files and folders</text>
  <text class="n-sub" x="587" y="146" text-anchor="middle">hashing, temp dirs, safe I/O</text>
  <text class="step" x="488" y="110">2</text>
  <path class="flow" d="M700 133 H716" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="722" y="94" width="232" height="78" rx="10"/>
  <text class="n-title" x="838" y="127" text-anchor="middle">logging, config, timing</text>
  <text class="n-sub" x="838" y="146" text-anchor="middle">what every member calls</text>
  <text class="step" x="733" y="110">3</text>
  <path class="flow" d="M980 126 H996" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1000" y="40">OUT</text>
  <rect class="io" x="1000" y="87" width="189" height="78" rx="10"/>
  <text class="n-title" x="1095" y="120" text-anchor="middle">the same behaviour</text>
  <text class="n-sub" x="1095" y="139" text-anchor="middle">macOS, Linux, Windows</text>
  <rect class="core" x="393" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="609" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="609" y="272" text-anchor="middle">the foundation every other member imports</text>
  <path class="tie" d="M609 286 V314 H345 V332"/>
  <path class="tie" d="M609 314 H873 V332"/>
  <path class="tie" d="M345 314 V332"/>
  <rect class="surface" x="270" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="345" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M521 314 V332"/>
  <rect class="surface" x="446" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="521" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M697 314 V332"/>
  <rect class="surface" x="622" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="697" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M873 314 V332"/>
  <rect class="surface" x="798" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="873" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="609" y="412" text-anchor="middle">The one member the whole suite depends on: every other helper routes its logging and its file handling through this.</text>
</svg>
