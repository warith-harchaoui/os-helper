# Human-language source of truth for os-helper's optional GUI.
#
# `gui:` holds every string the Tree Radar page shows. Code refers to these
# keys; this file owns the wording. Read by `os_helper.Locales` — the loader
# that lives in this very package (CODING.md 21.3), which is why os-helper
# reads its own locale file through the same door as every other member.
#
# There is no `prompts:` section, and there never will be one here: os-helper
# is the foundation of the suite and never talks to a model.

meta:
  default_locale: fr
  supported_locales:
  - fr
  - en

gui:
  # --- head / header -------------------------------------------------------
  # Bare strings, not locale mappings: "Tree Radar" is the dashboard's name
  # (it is called that in GUI.md and in the FastAPI app title), and a name is
  # the same sentence in every language.
  page_title: OS Helper — Tree Radar
  hero_title: Tree Radar

  # --- root input ----------------------------------------------------------
  root_placeholder:
    fr: /chemin/absolu/vers/le/dossier
    en: /absolute/path/to/folder
  root_aria:
    fr: Dossier à analyser
    en: Folder to scan
  scan_button:
    fr: Analyser
    en: Scan

  # --- colour mode selector ------------------------------------------------
  color_label:
    fr: 'Couleur :'
    en: 'Color:'
  mode_age:
    fr: âge
    en: age
  mode_dedupe:
    fr: doublons (empreinte)
    en: hash-dedupe
  mode_type:
    fr: famille de fichiers
    en: type family

  # --- status line ---------------------------------------------------------
  status_idle:
    fr: en attente
    en: idle

  # --- language toggle -----------------------------------------------------
  lang_toggle_href:
    fr: /gui?lang=en
    en: /gui?lang=fr
  lang_toggle_flag:
    fr: 🇬🇧
    en: 🇫🇷
  lang_toggle_aria:
    fr: English version
    en: Version française

  # --- strings written by the page's script --------------------------------
  # Templates carry named fields rather than being glued together in
  # JavaScript, so a translator can reorder the sentence (section 21.3.5).
  js_scanning:
    fr: analyse en cours…
    en: scanning…
  js_error_prefix:
    fr: 'erreur : '
    en: 'error: '
  js_need_root:
    fr: Indiquez d'abord un chemin de dossier.
    en: Enter a folder path first.
  js_status_scanned:
    fr: 'racine : {root} ({count} fichiers affichés)'
    en: 'root: {root} ({count} files shown)'
  js_tooltip_modified:
    fr: modifié le {when}
    en: modified {when}

  # --- type families, shown in the hover tooltip ---------------------------
  # The server sends the machine name (`code`, `data`, …); the page maps it
  # through these keys so the tooltip reads as a sentence, not as an enum.
  family_code:
    fr: code
    en: code
  family_data:
    fr: données
    en: data
  family_media:
    fr: médias
    en: media
  family_archive:
    fr: archive
    en: archive
  family_other:
    fr: autre
    en: other
  family_dir:
    fr: dossier
    en: dir
