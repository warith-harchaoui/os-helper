name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Super-light gate: heavy testing runs locally before push. We keep the
        # three OSes because cross-OS behaviour (unix() / windows() / macos()
        # detection, path semantics, text-vs-binary hashing) is os-helper's whole
        # reason to exist, but pin a single Python instead of a 4-version sweep.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # Pinned: an unpinned install let ruff 0.16 make Markdown code-fence
        # formatting the default, silently breaking format-check on doc examples.
        # Bump this deliberately, not by surprise.
        run: pip install "ruff==0.15.21"
      - name: Run ruff
        run: |
          ruff check .
          ruff format --check .

  floor:
    name: Floor (py3.10 installs and imports)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `requires-python = ">=3.10"` is a promise to anyone running `pip install`:
    # on 3.10 this package installs and imports. Nothing in the suite checked
    # it -- sixteen members made the promise and only speaker-helper ran the
    # version, so the rest was a claim with no evidence behind it. Verified by
    # hand across all seventeen before this job was added, so it starts green.
    #
    # Install and import, deliberately not the test suite. The tests use 3.11
    # features legitimately (`tomllib`, behind a `tomli` fallback), and gating
    # the floor on dev-only concerns would fail this job for reasons that have
    # nothing to do with the promise. No member carries torch in its base
    # dependencies, so this is a cached-wheel install: well under a minute,
    # which is the point.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install .
      - run: python -c "import os_helper"
